# Builds Raven's Windows installer on every push to main and for version tags.
# The installer (Raven_x.y.z_x64-setup.exe) appears under the run's "Artifacts";
# for tags like v0.2.0 it is also attached to a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Raven-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
