<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yeni sekme</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><span></span><span></span><span></span></div>
  <main class="home">
    <p id="greeting" class="greeting"></p>
    <div id="clock" class="clock">00:00</div>
    <div id="date" class="date"></div>
    <p class="private-note">Gizli sekme. Gezdiğin sayfalar geçmişe kaydedilmez, çerezler son gizli sekme kapanınca silinir</p>

    <form id="search" class="search" role="search">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="query" class="hidden">Ara</label>
      <input id="query" type="search" placeholder="Ara ya da adres yaz" autocomplete="off" spellcheck="false" autofocus>
      <button id="ask" type="button" class="ask" title="Yazdığını yan paneldeki yapay zekaya sor">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
        Sor
      </button>
    </form>

    <!-- Shortcuts: the most visited sites, until you add, edit or remove one. -->
    <nav id="shortcuts" class="shortcuts" aria-label="Kısayollar"></nav>
  </main>

  <!-- Customize this page. -->
  <button id="customize" class="customize" aria-label="Bu sayfayı özelleştir" title="Özelleştir">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    Özelleştir
  </button>
  <dialog id="custom" class="editor custom" aria-labelledby="custom-title">
    <form method="dialog">
      <h2 id="custom-title">Yeni sekmeyi özelleştir</h2>
      <fieldset class="choice">
        <legend>Arka plan</legend>
        <label><input type="radio" name="bg" value="sky"> Gökyüzü</label>
        <label><input type="radio" name="bg" value="plain"> Sade</label>
        <label><input type="radio" name="bg" value="image"> Resim</label>
      </fieldset>
      <label class="file"><span>Bilgisayardan resim seç…</span><input id="custom-image" type="file" accept="image/*"></label>
      <label class="row"><span>Saat ve tarih</span><input type="checkbox" class="switch" id="custom-clock"></label>
      <label class="row"><span>Selamlama</span><input type="checkbox" class="switch" id="custom-greeting"></label>
      <label class="row"><span>Kısayollar</span><input type="checkbox" class="switch" id="custom-shortcuts"></label>
      <div class="editor-actions"><button class="primary">Tamam</button></div>
    </form>
  </dialog>

  <!-- Small menu on a shortcut: edit or remove. -->
  <div id="menu" class="menu" role="menu" hidden>
    <button id="menu-edit" role="menuitem">Düzenle</button>
    <button id="menu-remove" role="menuitem">Kaldır</button>
  </div>

  <!-- Add or edit a shortcut. -->
  <dialog id="editor" class="editor" aria-labelledby="editor-title">
    <form id="editor-form" method="dialog">
      <h2 id="editor-title">Kısayol ekle</h2>
      <label>
        <span>Ad</span>
        <input id="editor-name" type="text" autocomplete="off" spellcheck="false" placeholder="Örneğin F2P Club">
      </label>
      <label>
        <span>Adres</span>
        <input id="editor-url" type="text" autocomplete="off" spellcheck="false" placeholder="f2pclub.app" required>
      </label>
      <div class="editor-actions">
        <button type="button" id="editor-cancel" class="secondary">İptal</button>
        <button type="submit" class="primary">Kaydet</button>
      </div>
    </form>
  </dialog>

  <template id="shortcut-template">
    <div class="shortcut">
      <a class="shortcut-link">
        <span class="mark" aria-hidden="true"></span>
        <span class="shortcut-name"></span>
      </a>
      <button class="more" aria-label="Kısayol seçenekleri" title="Seçenekler">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
    </div>
  </template>

  <script src="favicon.js"></script>
  <script src="themes.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
