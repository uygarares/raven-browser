<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yeni sekme</title>
  <script src="apply-theme.js"></script>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="home">
    <div id="clock" class="clock">00:00</div>
    <div id="date" class="date"></div>

    <form id="search" class="search" role="search">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="query" class="hidden">Ara</label>
      <input id="query" type="search" placeholder="Ara ya da adres yaz" autocomplete="off" spellcheck="false" autofocus>
      <kbd>Ctrl L</kbd>
    </form>

    <nav class="shortcuts" aria-label="Kısayollar">
      <a class="shortcut" href="https://www.youtube.com/"><span class="mark" aria-hidden="true">Y</span><span>YouTube</span></a>
      <a class="shortcut" href="https://f2pclub.app/"><span class="mark" aria-hidden="true">F</span><span>F2P Club</span></a>
      <a class="shortcut" href="https://github.com/"><span class="mark" aria-hidden="true">G</span><span>GitHub</span></a>
      <a class="shortcut" href="https://claude.ai/"><span class="mark" aria-hidden="true">C</span><span>Claude</span></a>
      <a class="shortcut" href="https://www.twitch.tv/"><span class="mark" aria-hidden="true">T</span><span>Twitch</span></a>
    </nav>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
