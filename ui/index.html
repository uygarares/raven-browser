<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raven</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Row 1: logo, tabs and window buttons. Empty space here moves the window. -->
  <div class="tab-row" data-tauri-drag-region>
    <img class="logo" src="logo.png" alt="Raven" data-tauri-drag-region>
    <div id="tabs" class="tabs" role="tablist" aria-label="Sekmeler"></div>
    <button id="new-tab" class="new-tab" aria-label="Yeni sekme (Ctrl + T)" title="Yeni sekme (Ctrl + T)">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="drag-space" data-tauri-drag-region></div>
    <div class="window-controls">
      <button id="minimize" class="control" aria-label="Küçült" title="Küçült">
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button id="maximize" class="control" aria-label="Büyüt" title="Büyüt">
        <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      </button>
      <button id="close" class="control close" aria-label="Kapat" title="Kapat">
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <!-- Row 2: navigation and address bar. -->
  <div class="nav-row">
    <button id="back" class="round" aria-label="Geri" title="Geri">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="forward" class="round" aria-label="İleri" title="İleri">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button id="reload" class="round" aria-label="Yenile" title="Yenile">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <form id="address-form" class="address">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="address" class="hidden">Adres</label>
      <input id="address" type="text" placeholder="Ara ya da adres yaz" autocomplete="off" spellcheck="false">
      <span id="loading" class="spinner" aria-hidden="true"></span>
    </form>
  </div>

  <template id="tab-template">
    <div class="tab" role="tab">
      <span class="tab-icon" aria-hidden="true"></span>
      <span class="tab-title"></span>
      <button class="tab-close" aria-label="Sekmeyi kapat" title="Sekmeyi kapat (Ctrl + W)">
        <svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </template>

  <script src="main.js"></script>
</body>
</html>
