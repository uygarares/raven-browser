<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Menü</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="menu" role="menu" aria-label="Raven menüsü">
    <button class="item" role="menuitem" data-action="new-tab">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">Yeni sekme</span><kbd>Ctrl+T</kbd>
    </button>
    <button class="item" role="menuitem" data-action="new-private-tab">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18"/><path d="M5 10l2-6h10l2 6"/><circle cx="8" cy="16" r="3"/><circle cx="16" cy="16" r="3"/><path d="M11 16h2"/></svg>
      <span class="label">Yeni gizli sekme</span><kbd>Ctrl+Shift+N</kbd>
    </button>

    <hr>

    <div class="item zoom-row" role="group" aria-label="Yakınlaştırma">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="label">Yakınlaştır</span>
      <button class="step" data-action="zoom-out" data-keep-open aria-label="Uzaklaştır (Ctrl + eksi)" title="Uzaklaştır (Ctrl + -)">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button id="zoom-value" class="zoom-value" data-action="zoom-reset" data-keep-open title="%100'e döndür (Ctrl + 0)">100%</button>
      <button class="step" data-action="zoom-in" data-keep-open aria-label="Yakınlaştır (Ctrl + artı)" title="Yakınlaştır (Ctrl + +)">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <hr>

    <button class="item" role="menuitem" data-action="open-history">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span class="label">Geçmiş</span><kbd>Ctrl+H</kbd>
    </button>
    <button class="item" role="menuitem" data-action="open-downloads">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      <span class="label">İndirmeler</span><kbd>Ctrl+J</kbd>
    </button>
    <button class="item" role="menuitem" data-action="toggle-bookmarks-bar">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
      <span id="bar-label" class="label">Yer imleri çubuğunu göster</span><kbd>Ctrl+Shift+B</kbd>
    </button>

    <hr>

    <button class="item" role="menuitem" data-action="open-settings">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span class="label">Ayarlar</span>
    </button>
  </div>
  <script src="menu.js"></script>
</body>
</html>
